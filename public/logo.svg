<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 44" fill="none">
  <defs>
    <linearGradient id="ashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c084fc" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="ashGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#a855f7" flood-opacity="0.4" />
    </filter>
  </defs>
  <!-- Geometric Logo Icon (Hexagonal / A-Apex mark) -->
  <g filter="url(#ashGlow)">
    <path d="M 18 6 L 30 22 L 24 38 L 8 38 L 4 22 Z" fill="none" stroke="url(#ashGrad)" stroke-width="2.5" />
    <path d="M 12 28 L 18 14 L 24 28" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="18" cy="22" r="2.5" fill="#ec4899" />
  </g>
  <!-- Wordmark "Ashency" -->
  <text x="40" y="28" font-family="'Bricolage Grotesque', sans-serif" font-weight="800" font-size="22" fill="#ffffff" letter-spacing="-0.03em">
    Ashency
  </text>
  <!-- Dot in gradient -->
  <circle cx="132" cy="26" r="3" fill="url(#ashGrad)" />
</svg>
